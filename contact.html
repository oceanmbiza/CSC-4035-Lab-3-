<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Lab3 Multipage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="contact-form-section" id="contactUs">
      <h1>Contact Us</h1>
      <form class="contact-form" action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" required>
        
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        
        <button type="submit" id="submit">Send Message</button>
      </form>
    </section>
    <script>
        // JavaScript to handle form submission
        document.getElementById('submit').addEventListener('click', function(event) {
            event.preventDefault(); // Prevent the default form submission
            alert('Your message has been sent!'); // Show a confirmation message
            document.querySelector('.contact-form').reset(); // Reset the form fields
        }); 
    </script>
  </main>
  <footer>
    <p>&copy; 2025 Lab3 Multipage. All rights reserved.</p>
  </footer>
</body>
</html>
